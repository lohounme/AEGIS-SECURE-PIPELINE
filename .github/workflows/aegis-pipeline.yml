name: AEGIS DevSecOps Pipeline

# Déclencheurs : chaque push ou PR sur main active le pipeline
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  # ----------------------------------------------------
  # JOB 1 : SECRET DETECTION (Gitleaks)
  # ----------------------------------------------------
  secret-scan:
    name: 🔑 Secret Detection (Gitleaks)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4.2.2
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ----------------------------------------------------
  # JOB 2 : SAST SCAN (Semgrep)
  # ----------------------------------------------------
  sast-scan:
    name: 🔬 SAST Code Analysis (Semgrep)
    runs-on: ubuntu-latest
    needs: secret-scan
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4.2.2

      - name: Set up Python
        uses: actions/setup-python@v5.4.0
        with:
          python-version: '3.11'

      - name: Install Semgrep
        run: pip install semgrep

      - name: Run Semgrep SAST Scan
        run: |
          semgrep scan --config=.semgrep/aegis-rules.yml --config=p/expressjs --config=p/nodejs --error src/

  # ----------------------------------------------------
  # JOB 3 : SCA SCAN (Snyk Open Source)
  # ----------------------------------------------------
  sca-scan:
    name: 📦 SCA Dependency Scan (Snyk)
    runs-on: ubuntu-latest
    needs: sast-scan
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4.2.2

      - name: Set up Node.js
        uses: actions/setup-node@v4.2.0
        with:
          node-version: '20' # LTS stable — aligné avec l'image de build Docker

      - name: Install Dependencies
        run: |
          cd src
          npm ci

      - name: Run Snyk SCA Scan
        uses: snyk/actions/node@master
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          args: --file=src/package.json --severity-threshold=high

  # ----------------------------------------------------
  # JOB 4 : CONTAINER SECURITY (Trivy & Docker Build)
  # ----------------------------------------------------
  container-security:
    name: 🐳 Container Scan & Hardening (Trivy)
    runs-on: ubuntu-latest
    needs: sca-scan
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4.2.2

      - name: Build Docker Image
        run: |
          docker build -t aegis-app:${{ github.sha }} -f docker/Dockerfile .

      - name: Run Trivy Container Vulnerability Scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'aegis-app:${{ github.sha }}'
          format: 'table'
          exit-code: '1'           # Blocage strict si CRITICAL détecté
          ignore-unfixed: true      # Ignorer si aucun patch disponible
          trivyignores: '.trivyignore' # Registre de risques acceptés & justifiés
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH' # Bloquer sur CRITICAL et HIGH
